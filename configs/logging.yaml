version: 1
disable_existing_loggers: false

formatters:
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"
  colored:
    class: structlog.stdlib.ProcessorFormatter
    processor: structlog.dev.ConsoleRenderer(colors=True)

handlers:
  console:
    class: logging.StreamHandler
    formatter: colored
    level: INFO
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    filename: "logs/neural_ai.log"
    formatter: json
    level: DEBUG
    maxBytes: 10485760
    backupCount: 5
    encoding: "utf-8"

  trace_file:
    class: logging.handlers.RotatingFileHandler
    filename: "logs/trace.log"
    formatter: json
    level: DEBUG
    maxBytes: 10485760
    backupCount: 3
    encoding: "utf-8"

loggers:
  # --- FŐ ALKALMAZÁS LOGGER ---
  # Minden belső logger ebből örököl. A handlereket itt definiáljuk központilag.
  neural_ai:
    level: INFO
    handlers: [console, file]
    propagate: false # Ne küldje tovább a root-ra, elkerülve a duplikált logokat.

  # --- SPECIFIKUS MODULOK FELÜLBÍRÁLÁSA (OVERRIDE) ---
  # Csak a szintet (level) írjuk felül, a handlereket öröklik.
  neural_ai.core.logger:
    level: WARNING # Megakadályozza a rekurzív logolást a logger factory-ban.
  neural_ai.data.storage:
    level: DEBUG   # Részletesebb logolás az adattároló rétegben.
  neural_ai.ui.components:
    level: WARNING

  # --- TRACE RENDSZER ---
  # Különálló logger a @trace dekorátorok számára, saját fájllal.
  neural_ai.trace:
    level: DEBUG
    handlers: [trace_file]
    propagate: false

  # --- KÜLSŐ KÖNYVTÁRAK ZAJCSÖKKENTÉSE ---
  # Nincs handlerük, a root loggerre propagálnak.
  aiosqlite:
    level: WARNING
  asyncio:
    level: WARNING
  parso:
    level: WARNING
  watchdog:
    level: WARNING
  matplotlib:
    level: WARNING
  numba:
    level: WARNING

# Gyökér logger, ami minden mást (főleg külső libeket) elkap.
root:
  level: INFO
  handlers: [console]