# Structlog specifikus konfiguráció (nem standard logging dictConfig!)
# Ez a config a LoggerFactory.configure() metódus számára készült

# Alapértelmezett log szint
default_level: "INFO"

# Handler konfigurációk
handlers:
  console:
    enabled: true
    level: "DEBUG"  # Console-ra DEBUG szint felettiek mennek (színesen)
    colored: true     # Színes kimenet console-ra

  file:
    enabled: true
    filename: "logs/neural_ai.log"
    level: "DEBUG"
    json_format: true
    rotating: true
    max_bytes: 10485760
    backup_count: 5

  trace_file:
    enabled: true
    class: "logging.handlers.RotatingFileHandler"
    filename: "logs/trace.log"
    level: "DEBUG"
    maxBytes: 10485760
    backupCount: 3
    encoding: "utf-8"

# Specifikus logger konfigurációk
loggers:
  # --- FŐ ALKALMAZÁS LOGGER ---
  neural_ai:
    level: "INFO"
    propagate: true

  # --- SPECIFIKUS MODULOK FELÜLBÍRÁLÁSA ---
  # CORE INFRASTRUCTURE
  neural_ai.core.logger:
    level: "WARNING"  # Megakadályozza a rekurzív logolást
  neural_ai.core.config:
    level: "DEBUG"
  neural_ai.core.events:
    level: "DEBUG"
  neural_ai.core.db:
    level: "DEBUG"
  neural_ai.core.system:
    level: "WARNING"
  neural_ai.core.utils:
    level: "DEBUG"

  # DATA LAYER
  neural_ai.data.storage:
    level: "DEBUG"
  neural_ai.data.ingestion:
    level: "DEBUG"

  # DOMAIN LAYER
  neural_ai.processors:
    level: "DEBUG"
  neural_ai.processors.dimensions:
    level: "DEBUG"
  neural_ai.processors.pipeline:
    level: "INFO"
  neural_ai.processors.resampler:
    level: "DEBUG"

  # PRESENTATION LAYER
  neural_ai.ui:
    level: "DEBUG"
  neural_ai.ui.components:
    level: "DEBUG"
  neural_ai.ui.pages:
    level: "DEBUG"

  # INPUT LAYER
  neural_ai.collectors:
    level: "DEBUG"
  neural_ai.collectors.jforex:
    level: "DEBUG"
  neural_ai.collectors.mt5:
    level: "INFO"

  # TRACE RENDSZER
  neural_ai.trace:
    level: "DEBUG"
    # A trace_handler hozzáadását a factory intézi

  # KÜLSŐ LIBEK ZAJCSÖKKENTÉSE
  aiosqlite:
    level: "WARNING"
  asyncio:
    level: "WARNING"
  parso:
    level: "WARNING"
  watchdog:
    level: "WARNING"
  matplotlib:
    level: "WARNING"
  numba:
    level: "WARNING"